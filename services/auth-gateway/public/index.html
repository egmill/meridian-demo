<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meridian Online Banking</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">M</span> Meridian <span class="muted">Online Banking</span></div>
    <div id="session" class="session muted">Not signed in</div>
  </header>

  <main class="grid">
    <!-- Authentication -->
    <section class="card">
      <h2>Sign in</h2>
      <p class="hint">auth-gateway</p>
      <form id="login-form">
        <label>Username <input name="username" value="jdoe" autocomplete="username"></label>
        <label>Password <input name="password" type="password" value="Meridian!2026" autocomplete="current-password"></label>
        <label>MFA code <input name="mfaCode" inputmode="numeric" placeholder="6-digit code"></label>
        <button type="submit">Sign in</button>
      </form>
      <div id="login-result" class="result" role="status"></div>
    </section>

    <!-- Transactions -->
    <section class="card wide">
      <h2>Accounts &amp; transfers</h2>
      <p class="hint">transaction-service</p>
      <table class="table">
        <thead><tr><th>Account</th><th>Name</th><th class="num">Balance</th></tr></thead>
        <tbody id="accounts-body"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
      </table>
      <form id="transfer-form" class="row-form">
        <label>From <select name="fromAccountId" id="from-select"></select></label>
        <label>To <select name="toAccountId" id="to-select"></select></label>
        <label>Amount ($) <input name="amount" type="number" step="0.01" placeholder="0.00"></label>
        <label class="grow">Memo <input name="memo" placeholder="Optional"></label>
        <button type="submit">Send transfer</button>
      </form>
      <div id="transfer-result" class="result" role="status"></div>
    </section>

    <!-- PII -->
    <section class="card">
      <h2>Customer profile</h2>
      <p class="hint">pii-vault</p>
      <label>Customer <select id="customer-select"></select></label>
      <dl id="customer-profile" class="profile"></dl>
      <details>
        <summary>Add customer</summary>
        <form id="customer-form">
          <label>Name <input name="name" required></label>
          <label>Email <input name="email" type="email" required></label>
          <label>SSN <input name="ssn" required placeholder="000-00-0000"></label>
          <button type="submit">Create</button>
        </form>
      </details>
      <div id="customer-result" class="result" role="status"></div>
    </section>

    <!-- Audit -->
    <section class="card wide">
      <h2>Audit trail</h2>
      <p class="hint">audit-log</p>
      <button id="audit-refresh" class="secondary">Refresh</button>
      <table class="table">
        <thead><tr><th>#</th><th>Time (UTC)</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead>
        <tbody id="audit-body"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
