name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  transaction-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/transaction-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit tests + coverage
        run: mvn -B test
      - name: Mutation testing (PIT, threshold 70%)
        run: mvn -B org.pitest:pitest-maven:mutationCoverage -DmutationThreshold=70
      - name: Upload coverage and mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-service-reports
          path: |
            services/transaction-service/target/site/jacoco
            services/transaction-service/target/pit-reports
