name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  transaction-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/transaction-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit tests + coverage
        run: mvn -B test

  audit-log:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audit-log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/audit-log/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests + coverage
        run: pytest --cov=app --junitxml=test-results.xml
